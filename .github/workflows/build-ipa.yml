name: Build DNSCloak IPA

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-project:
    runs-on: macos-latest

    steps:
    - name: Ambil Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'

    - name: Setup Golang (Dinaikkan ke 1.23 agar Kompatibel)
    - name: Setup Golang (Dinaikkan ke 1.23)
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Install & Init Gomobile (Wajib untuk Build Core Go ke iOS)
    - name: Install & Init Gomobile + Buka Izin Folder
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile init
        # Membuka paksa izin folder cache Go agar tidak terjadi "Permission denied"
        chmod -R +w ${{ github.workspace }} || true

    - name: Ganti node-sass ke sass (Modern & Tanpa Python)
      run: |
@@ -50,26 +52,28 @@
    - name: Build Framework & Persiapan Folder Cordova
      run: |
        npm run build --if-present
        # Buka izin folder sekali lagi setelah build framework selesai
        chmod -R +w ${{ github.workspace }} || true

    - name: Kompilasi Proyek Xcode (Tanpa Perintah Clean)
      run: |
        xcodebuild -workspace platforms/ios/DNSCryptApp.xcworkspace \
                   -scheme DNSCryptApp \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build \
                   build

    - name: Bungkus Menjadi File IPA
      run: |
        mkdir -p Payload
        cp -r ${{ github.workspace }}/build/DNSCryptApp.app Payload/ || cp -r build/DNSCryptApp.app Payload/
        zip -r DNSCloak.ipa Payload

    - name: Upload Hasil Jadi .IPA
      uses: actions/upload-artifact@v4
      with:
        name: DNSCloak-Free-Version
        path: DNSCloak.ipa
